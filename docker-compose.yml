services:
  postgres:
    image: postgres:17
    container_name: study-postgres
    restart: always

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
  
  postgres-test:
    image: postgres:17
    
    environment:
      POSTGRES_DB: study_management_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"

  backend:
    build:
      context: ./backend/study-management-app
      dockerfile: Dockerfile

    container_name: study-backend

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      - postgres

  backend-test:

    image: gradle:9.5.1-jdk21

    working_dir: /app

    volumes:
      - ./backend/study-management-app:/app

    depends_on:
      - postgres-test

    command: gradle test

  frontend:
    build:
      context: ./frontend/study-management-app
      dockerfile: Dockerfile

    container_name: study-frontend

    ports:
      - "3000:3000"

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080

    depends_on:
      - backend

volumes:
  postgres-data: